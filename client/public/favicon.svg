<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
    <clipPath id="round"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <!-- Fundo -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="860" cy="150" r="260" fill="#FFFFFF" opacity="0.07" clip-path="url(#round)"/>

  <!-- Prancheta -->
  <g filter="url(#shadow)">
    <rect x="252" y="210" width="520" height="640" rx="64" fill="url(#board)"/>
  </g>

  <!-- Clipe -->
  <rect x="392" y="168" width="240" height="96" rx="36" fill="url(#clip)"/>
  <circle cx="512" cy="196" r="18" fill="#4338CA" opacity="0.9"/>

  <!-- Item 1 (concluído) -->
  <rect x="322" y="330" width="104" height="104" rx="28" fill="#22C55E"/>
  <path d="M347 383 l26 26 l44 -50" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="466" y="358" width="236" height="22" rx="11" fill="#C7CBF5"/>
  <rect x="466" y="398" width="150" height="18" rx="9" fill="#DDE0FA"/>

  <!-- Item 2 (concluído) -->
  <rect x="322" y="480" width="104" height="104" rx="28" fill="#22C55E"/>
  <path d="M347 533 l26 26 l44 -50" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="466" y="508" width="236" height="22" rx="11" fill="#C7CBF5"/>
  <rect x="466" y="548" width="180" height="18" rx="9" fill="#DDE0FA"/>

  <!-- Item 3 (pendente) -->
  <rect x="332" y="640" width="84" height="84" rx="22" fill="none" stroke="#A5ABEF" stroke-width="20"/>
  <rect x="466" y="658" width="236" height="22" rx="11" fill="#C7CBF5"/>
  <rect x="466" y="698" width="120" height="18" rx="9" fill="#DDE0FA"/>
</svg>
